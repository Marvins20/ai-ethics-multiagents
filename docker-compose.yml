services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    command: uv run uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - chroma_data:/app/data/chroma
      - ./data/uploads:/app/data/uploads
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: uv run arq src.worker.settings.WorkerSettings
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      - redis

volumes:
  redis_data:
  chroma_data:
